interface:
  display_name: "Project Tutor"
  short_description: "Learn a codebase visually with guided, continuous lessons"
  default_prompt: "Introduce Project Tutor, let me choose Hybrid, Explanation, or Guided mode, then inspect this repository and propose a short learning roadmap. Teach with simple diagrams first for business flows and architecture, keep text concise, move automatically through knowledge points and chapters, and never ask for permission to continue at chapter boundaries. Pause only when I explicitly ask. I do not want source-code reading homework."

policy:
  allow_implicit_invocation: false
