interface:
  display_name: "Project Tutor"
  short_description: "Understand a codebase through clear explanations"
  default_prompt: "Introduce Project Tutor and let me choose Hybrid, Explanation, or Guided mode. Then inspect this repository and explain its business and architecture in plain language. You read the code; I do not want source-code reading homework. Explain first and ask only easy questions grounded in what you have already taught."

policy:
  allow_implicit_invocation: false
