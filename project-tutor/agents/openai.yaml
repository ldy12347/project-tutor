interface:
  display_name: "Project Tutor"
  short_description: "Learn codebases with Mermaid-first diagrams and continuous lessons"
  default_prompt: "Introduce Project Tutor, let me choose Hybrid, Explanation, or Guided mode, then inspect this repository and propose a short learning roadmap. Use Mermaid diagrams first for business flows and architecture, with ASCII fallback if the client cannot render Mermaid; use generated images only for unusually complex spatial layouts. Keep text concise, move automatically through knowledge points and chapters, and never ask for permission to continue at chapter boundaries. Pause only when I explicitly ask. I do not want source-code reading homework."

policy:
  allow_implicit_invocation: false
